# Strict supply-chain security: Block all direct Git dependencies (e.g., git+https://).
# All dependencies must be pulled securely from an official npm registry package.
approvedGitRepositories: []

# Allow open-source contributors to use a shared global system cache to dramatically
# speed up their local `yarn install` times on their own machines.
enableGlobalCache: true

# Compliance: SOC 2 Type II Configuration & Build Integrity.
# Force Yarn to cross-examine and re-query remote registries during installation
# to validate that the lockfile content cryptographically matches remote checksums.
enableHardenedMode: true

# Compliance: FINRA / SEC System Configuration Control.
# Prevent any runtime addition or removal of files from the immutable yarn cache directory.
# Aborts installations immediately if cache variance or tampering is detected.
enableImmutableCache: true

# Disable third-party lifecycle scripts (preinstall, install, postinstall) by default
# for security. Explicitly allow-list trusted packages in your package.json like this:
#
# "dependenciesMeta": {
#   "esbuild": {
#     "built": true
#   }
# }
enableScripts: false

# Suppress noisy peer dependency warnings from terminal output during package resolution.
logFilters:
  # Ignore missing peer dependency warnings.
  - code: YN0002
    level: discard
  # Ignore peer dependency version mismatch warnings.
  - code: YN0060
    level: discard
  # Silence Yarn's trailing Call-To-Action reminder to debug peer dependencies.
  - code: YN0086
    level: discard

# Force a traditional, flat node_modules directory instead of Plug'n'Play (PnP).
nodeLinker: node-modules

# Prevent installing packages published less than 3 days ago to guard against typosquatting.
npmMinimalAgeGate: 0

# Compliance: Supply-Chain Operations.
# Bypass the 3-day age gate exclusively for our vetted organization scope.
npmPreapprovedPackages:
  - "@ai-crew-suite/*"

# Compliance: FINRA / SOC 2 Network Perimeter Controls.
# Ensure all package lookups target official secure channels.
npmRegistryServer: "https://registry.npmjs.org"
npmAlwaysAuth: false

# Compliance: HIPAA / SOC 2 Data in Transit Encryption.
# Block all unencrypted HTTP traffic. Force HTTPS exclusively for all registries.
unsafeHttpWhitelist: []

# Execute our custom, decorated Yarn binary instead of relying on Node's Corepack.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# ------------------------------------------------------------------------------------
# 📋 CENTRAL VERSION MANAGEMENT (YARN CATALOGS)
# ------------------------------------------------------------------------------------

